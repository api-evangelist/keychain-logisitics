aid: keychain-logisitics
name: Keychain
description: >-
  Keychain is an AI-powered operating system and network for the consumer
  packaged goods (CPG) industry, connecting brands and retailers with the
  contract manufacturers, co-packers, and suppliers that make their products.
  The platform lets CPG brands discover and match with vetted manufacturing
  partners, manage sourcing and production relationships, and streamline the
  supplier-discovery workflow that has traditionally been manual and
  relationship-driven. Backed by Andreessen Horowitz (a16z), Keychain was added
  to the API Evangelist network as a company profile surfaced from the a16z
  venture portfolio. As of this enrichment pass Keychain publishes a marketing
  and product web presence at keychain.com but does not expose a public
  developer program, API reference, or machine-readable API discovery surface
  (no developer/API subdomain, no /.well-known catalog, no llms.txt).
